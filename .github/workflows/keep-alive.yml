name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping (Render sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          # Replace this with your actual Render URL once it's deployed
          API_URL="https://bizim-pk-api.onrender.com"
          
          echo "Pinging $API_URL to keep it awake..."
          curl -s "$API_URL" > /dev/null
          echo "Ping successful!"
