services:
  - type: web
    name: bizim-pk-api
    env: docker
    region: singapore # Adjust based on your preferred region
    plan: free # Change to starter/standard if needed
    dockerCommand: ""
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: DEFAULT_CONNECTION
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
